<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .bg { fill: #f9f9ff; }
    .screen-bg { fill: #e3e8ff; }
    .screen-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1b1b1f; text-anchor: end; }
    .key-bg { fill: #e3e8ff; }
    .key-op-bg { fill: #dbe3ff; }
    .key-main-bg { fill: #0b57d0; }
    .txt-num { font-family: system-ui, -apple-system, sans-serif; font-size: 8px; font-weight: 600; fill: #1b1b1f; text-anchor: middle; dominant-baseline: central; }
    .txt-op { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 700; fill: #0b57d0; text-anchor: middle; dominant-baseline: central; }
    .txt-main { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Sfondo dello chassis -->
  <rect class="bg" width="128" height="128" rx="20"/>

  <!-- Display calcolatrice -->
  <rect class="screen-bg" x="10" y="10" width="108" height="22" rx="8"/>
  <text class="screen-text" x="110" y="27">0</text>

  <!-- RIGA 1: AC, ⌫, %, ÷ -->
  <g>
    <rect class="key-op-bg" x="10" y="38" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-op" x="22.375" y="44.8">AC</text>

    <rect class="key-op-bg" x="37.75" y="38" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-op" x="50.125" y="44.8">⌫</text>

    <rect class="key-op-bg" x="65.5" y="38" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-op" x="77.875" y="44.8">%</text>

    <rect class="key-op-bg" x="93.25" y="38" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-op" x="105.625" y="44.8">÷</text>
  </g>

  <!-- RIGA 2: 7, 8, 9, × -->
  <g>
    <rect class="key-bg" x="10" y="54.6" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-num" x="22.375" y="61.4">7</text>

    <rect class="key-bg" x="37.75" y="54.6" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-num" x="50.125" y="61.4">8</text>

    <rect class="key-bg" x="65.5" y="54.6" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-num" x="77.875" y="61.4">9</text>

    <rect class="key-op-bg" x="93.25" y="54.6" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-op" x="105.625" y="61.4">×</text>
  </g>

  <!-- RIGA 3: 4, 5, 6, − -->
  <g>
    <rect class="key-bg" x="10" y="71.2" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-num" x="22.375" y="78">4</text>

    <rect class="key-bg" x="37.75" y="71.2" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-num" x="50.125" y="78">5</text>

    <rect class="key-bg" x="65.5" y="71.2" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-num" x="77.875" y="78">6</text>

    <rect class="key-op-bg" x="93.25" y="71.2" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-op" x="105.625" y="78">−</text>
  </g>

  <!-- RIGA 4: 1, 2, 3, + -->
  <g>
    <rect class="key-bg" x="10" y="87.8" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-num" x="22.375" y="94.6">1</text>

    <rect class="key-bg" x="37.75" y="87.8" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-num" x="50.125" y="94.6">2</text>

    <rect class="key-bg" x="65.5" y="87.8" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-num" x="77.875" y="94.6">3</text>

    <rect class="key-op-bg" x="93.25" y="87.8" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-op" x="105.625" y="94.6">+</text>
  </g>

  <!-- RIGA 5: 0, ., ±, = -->
  <g>
    <rect class="key-bg" x="10" y="104.4" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-num" x="22.375" y="111.2">0</text>

    <rect class="key-bg" x="37.75" y="104.4" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-num" x="50.125" y="111.2">.</text>

    <rect class="key-op-bg" x="65.5" y="104.4" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-op" x="77.875" y="111.2">±</text>

    <rect class="key-main-bg" x="93.25" y="104.4" width="24.75" height="13.6" rx="6.8"/>
    <text class="txt-main" x="105.625" y="111.2">=</text>
  </g>
</svg>
