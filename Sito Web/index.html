  <meta name="theme-color" content="#f9f9ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Simon-Calcolatrice">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    :root { --app-h: 100vh; --primary: #0b57d0; --on-primary: #fff; --surface: #f9f9ff; --surface-variant: #e3e8ff; --text: #1b1b1f; --secondary: #4a5b7c; --error: #d00000; --radius: 22px; --radius-pill: 999px; }
    * { box-sizing: border-box; font-family: system-ui; -webkit-tap-highlight-color: rgba(0, 0, 0, 0); }
    html, body { margin: 0; padding: 0; min-height: var(--app-h, 100vh); background: #e3f2fd; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; touch-action: manipulation; }
    body { display: flex; justify-content: center; align-items: stretch; overflow-x: hidden; }
    .app { width: 100%; min-height: var(--app-h, 100vh); background: var(--surface); padding: clamp(10px, 1.6vh, 16px) clamp(12px, 3vw, 24px); display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 14px); }
    /* L'altezza la decide --app-h (impostata da JS con l'area visibile reale: sull'app coincide
       con lo schermo, sul sito web esclude la barra degli indirizzi). Le safe-area tengono il
       contenuto fuori da notch e gesture bar quando l'app viene avviata a schermo intero. */
    .app { padding-top: max(clamp(10px, 1.6vh, 16px), env(safe-area-inset-top)); padding-bottom: max(clamp(10px, 1.6vh, 16px), env(safe-area-inset-bottom)); padding-left: max(clamp(12px, 3vw, 24px), env(safe-area-inset-left)); padding-right: max(clamp(12px, 3vw, 24px), env(safe-area-inset-right)); }
    .header { display: flex; justify-content: space-between; align-items: center; gap: clamp(4px, 1vw, 8px); }
    .title { font-size: clamp(1rem, 2.4vh, 1.4rem); font-weight: 700; text-align: center; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn { border: none; background: var(--primary); color: var(--on-primary); min-height: 40px; padding: 6px clamp(10px, 1.8vw, 14px); border-radius: var(--radius-pill); cursor: pointer; display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: clamp(0.75rem, 1.8vh, 0.95rem); max-width: 40vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn svg { width: clamp(16px, 2.4vh, 20px); height: clamp(16px, 2.4vh, 20px); fill: var(--on-primary); }
    .mode-toggle { display: inline-flex; background: var(--surface-variant); border-radius: var(--radius-pill); padding: 4px; gap: 4px; flex-shrink: 0; }
    .mode-chip { border: none; border-radius: var(--radius-pill); min-height: 40px; padding: 6px clamp(10px, 2vw, 14px); font-size: clamp(0.78rem, 1.6vh, 0.9rem); cursor: pointer; background: transparent; color: var(--secondary); white-space: nowrap; }
    .mode-chip.active { background: var(--primary); color: var(--on-primary); }
    .display { background: var(--surface-variant); border-radius: var(--radius); padding: clamp(10px, 1.8vh, 18px) clamp(12px, 2vw, 20px); display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .exp { font-size: clamp(0.8rem, 1.8vh, 1rem); color: var(--secondary); text-align: right; min-height: 1.3em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .res { font-size: clamp(1.6rem, 5vh, 2.6rem); font-weight: 700; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .error { color: var(--error); }
    /* === KEYPAD ADATTIVO === */
    .keypad { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(32px, 1fr); gap: clamp(6px, 1.2vh, 12px); flex: 1 0 auto; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .key { background: #e3e8ff; border: none; padding: 0; border-radius: var(--radius-pill); font-size: clamp(0.9rem, 3vh, 1.5rem); cursor: pointer; transition: transform 0.08s; display: flex; align-items: center; justify-content: center; }
    .key-op { background: #dbe3ff; color: var(--primary); }
    .key-main { background: var(--primary); color: var(--on-primary); }
    .adv-key { background: #dbe3ff; border: none; padding: 0; border-radius: var(--radius-pill); font-size: clamp(0.75rem, 2.2vh, 1.1rem); cursor: pointer; transition: transform 0.08s; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.25); display: none; justify-content: flex-start; align-items: stretch; z-index: 10; }
    .drawer-overlay.visible { display: flex; }
    .drawer { width: min(420px, 92vw); background: var(--surface); padding: 16px 0; display: flex; flex-direction: column; gap: 8px; border-radius: 0 22px 22px 0; overflow: hidden; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; padding: 0 24px; flex-shrink: 0; }
    .drawer-title { font-size: 1rem; font-weight: 600; }
    .close-btn { border: none; background: transparent; cursor: pointer; padding: 10px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .close-btn svg { width: 22px; height: 22px; fill: #000; }
    .clear-all-btn { display: none; margin: 4px 24px 8px; padding: 12px 18px; border: none; background: #ffe5e5; color: #8a0000; border-radius: var(--radius-pill); font-size: 0.95rem; font-weight: 700; cursor: pointer; text-align: center; font-family: inherit; transition: background 0.15s, transform 0.08s; }
    .clear-all-btn.visible { display: block; }
    .clear-all-btn:hover { background: #ffcccc; }
    .history-list { max-height: 70vh; overflow-y: auto; padding: 0 24px; scrollbar-gutter: stable; }
    .history-list::-webkit-scrollbar { width: 8px; }
    .history-list::-webkit-scrollbar-thumb { background: #c3cbe6; border-radius: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-item { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 12px; font-size: 0.95rem; border-radius: 12px; transition: background 0.15s; cursor: pointer; }
    .history-item:hover { background: #eef2ff; }
    .history-item.active { background: #dbe3ff; font-weight: 600; }
    .history-item > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
    .history-del { flex: 0 0 auto; border: none; background: #ffe5e5; cursor: pointer; width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
    .history-del svg { width: 16px; height: 16px; fill: var(--error); display: block; }
    .history-empty { color: var(--secondary); font-size: 0.9rem; font-style: italic; padding: 8px 12px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-overlay.visible { display: flex; }
    .modal { background: var(--surface); border-radius: var(--radius); padding: 24px 22px 18px; max-width: 380px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 18px; animation: modalIn 0.18s ease-out; }
    @keyframes modalIn { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-text { font-size: 1.05rem; font-weight: 600; text-align: center; color: var(--text); line-height: 1.4; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-btn { border: none; padding: 14px 12px; border-radius: var(--radius-pill); font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: transform 0.08s, filter 0.15s; }
    .modal-btn-yes { background: #ffe5e5; color: #8a0000; }
    .modal-btn-yes:hover { background: #ffcccc; }
    .modal-btn-no { background: var(--primary); color: var(--on-primary); }
    .modal-btn-no:hover { filter: brightness(1.08); }
    /* === FEEDBACK DI PREMUTA NATIVO (no blocco blu, no alone di tap) === */
    button { outline: none; -webkit-tap-highlight-color: rgba(0, 0, 0, 0); touch-action: manipulation; position: relative; overflow: hidden; transition: transform 130ms cubic-bezier(0.34, 1.56, 0.64, 1), filter 130ms ease-out; }
    button:focus, button:focus-visible { outline: none; }
    button:active { transform: scale(0.92); filter: brightness(0.93); transition: transform 70ms ease-in, filter 70ms ease-in; }
    .mode-chip:active { transform: scale(0.94); }

    /* === SCHERMI STRETTI (telefono piccolo, caratteri di sistema ingranditi): header compatto,
       il titolo si comprime con i puntini invece di far scorrere la pagina === */
    @media (max-width: 430px) {
      .app { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }

      .app { gap: 6px; }

      .mode-chip { padding: 4px 10px; }

  <script>

    const TRANSLATIONS = {

      el:{title:"Simon-Αριθμομηχανή",history:"Ιστορικό",normal:"Κανονική",advanced:"Προχωρημένη",error:"ΣΦΑΛΜΑ",empty:"Δεν υπάρχουν υπολογισμοί!",delete:"Διαγραφή",clearAll:"Διαγραφή όλων",confirmClear:"Διαγραφή όλου του ιστορικού;"},
      he:{title:"Simon-מחשבון",history:"היסטוריה",normal:"רגיל",advanced:"מתקדם",error:"שגיאה",empty:"אין חישובים עדיין!",delete:"מחק",clearAll:"מחק הכל",confirmClear:"למחוק את כל ההיסטוריה?"},
      cs:{title:"Simon-Kalkulačka",history:"Historie",normal:"Normální",advanced:"Pokročilá",error:"CHYBA",empty:"Zatím žádné výpočty!",delete:"Smazat",clearAll:"Smazat vše",confirmClear:"Smazat celou historii?"},
      sk:{title:"Simon-Kalkulačka",history:"História",normal:"Normálne",advanced:"Pokročilé",error:"CHYBA",empty:"Zatiaľ žiadne výpočty!",delete:"Odstrániť",clearAll:"Vymazať všetko",confirmClear:"Vymazať celú históriu?"},
      hu:{title:"Simon-Számológép",history:"Előzmények",normal:"Normál",advanced:"Speciális",error:"HIBA",empty:"Még nincs számítás!",delete:"Törlés",clearAll:"Összes törlése",confirmClear:"Törli a teljes előzményt?"},
      ro:{title:"Simon-Calculator",history:"Istoric",normal:"Normal",advanced:"Avansat",error:"EROARE",empty:"Încă nu există calcule!",delete:"Șterge",clearAll:"Șterge tot",confirmClear:"Ștergi tot istoricul?"},
      bg:{title:"Simon-Калкулатор",history:"История",normal:"Обикновен",advanced:"Разширен",error:"ГРЕШКА",empty:"Още няма изчисления!",delete:"Изтрий",clearAll:"Изтрий всичко",confirmClear:"Изтриване на цялата история?"},
      hr:{title:"Simon-Kalkulator",history:"Povijest",normal:"Normalno",advanced:"Napredno",error:"GREŠKA",empty:"Još nema izračuna!",delete:"Izbriši",clearAll:"Obriši sve",confirmClear:"Obrisati cijelu povijest?"},
      sr:{title:"Simon-Калкулатор",history:"Историја",normal:"Обичан",advanced:"Напредни",error:"ГРЕШКА",empty:"Још нема прорачуна!",delete:"Обриши",clearAll:"Обриши све",confirmClear:"Обрисати целу историју?"},
      uk:{title:"Simon-Калькулятор",history:"Історія",normal:"Звичайний",advanced:"Розширений",error:"ПОМИЛКА",empty:"Ще немає обчислень!",delete:"Видалити",clearAll:"Очистити все",confirmClear:"Очистити всю історію?"},
      th:{title:"Simon-เครื่องคิดเลข",history:"ประวัติ",normal:"ปกติ",advanced:"ขั้นสูง",error:"ข้อผิดพลาด",empty:"ยังไม่มีการคำนวณ!",delete:"ลบ",clearAll:"ลบทั้งหมด",confirmClear:"ลบประวัติทั้งหมดหรือไม่?"},
      vi:{title:"Simon-Máy tính",history:"Lịch sử",normal:"Thường",advanced:"Nâng cao",error:"LỖI",empty:"Chưa có phép tính nào!",delete:"Xóa",clearAll:"Xóa tất cả",confirmClear:"Xóa toàn bộ lịch sử?"},
      id:{title:"Simon-Kalkulator",history:"Riwayat",normal:"Normal",advanced:"Lanjutan",error:"KESALAHAN",empty:"Belum ada perhitungan!",delete:"Hapus",clearAll:"Hapus semua",confirmClear:"Hapus semua riwayat?"},
      ms:{title:"Simon-Kalkulator",history:"Sejarah",normal:"Biasa",advanced:"Lanjutan",error:"RALAT",empty:"Belum ada pengiraan!",delete:"Padam",clearAll:"Padam semua",confirmClear:"Padam semua sejarah?"},
      fil:{title:"Simon-Calculator",history:"Kasaysayan",normal:"Normal",advanced:"Advanced",error:"ERROR",empty:"Wala pang kalkulasyon!",delete:"Burahin",clearAll:"Burahin lahat",confirmClear:"Burahin ang lahat ng kasaysayan?"},
      sw:{title:"Simon-Kikokotoo",history:"Historia",normal:"Kawaida",advanced:"Juu",error:"KOSA",empty:"Hakuna hesabu bado!",delete:"Futa",clearAll:"Futa zote",confirmClear:"Futa historia yote?"},
      ca:{title:"Simon-Calculadora",history:"Historial",normal:"Normal",advanced:"Avançada",error:"ERROR",empty:"Encara no hi ha càlculs!",delete:"Elimina",clearAll:"Esborra tot",confirmClear:"Esborrar tot l'historial?"}
    };

    const DEFAULT_LANG = "it";

    function detectLanguage() {
      let browserLang = null;
      try {
        if (navigator.languages && navigator.languages.length) browserLang = navigator.languages[0];
        else browserLang = navigator.language || navigator.userLanguage || null;
      } catch (e) {
        browserLang = null;
      }
      if (!browserLang || typeof browserLang !== "string" || browserLang.trim() === "") {
        return DEFAULT_LANG;
      }
      const base = browserLang.split("-")[0].toLowerCase();
      if (TRANSLATIONS[base]) return base;
      return DEFAULT_LANG;
    }

    const LANG = detectLanguage();
    const t = TRANSLATIONS[LANG];

    function tt(key) {
      return (t && t[key]) || TRANSLATIONS.it[key] || key;
    }

    function applyTranslations() {
      document.documentElement.lang = LANG;
      document.title = tt("title");
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.textContent = tt(key);
      });
      const i18nTitle = document.getElementById("i18nTitle");
      const i18nHistory = document.getElementById("i18nHistory");
      const clearAllBtn = document.getElementById("clearAllBtn");
      const confirmText = document.getElementById("confirmText");
      if (i18nTitle) i18nTitle.textContent = tt("title");
      if (i18nHistory) i18nHistory.textContent = tt("history");
      if (clearAllBtn) clearAllBtn.textContent = tt("clearAll");
      if (confirmText) confirmText.textContent = tt("confirmClear");
    }

    /* ========================================================= LOGICA CALCOLATRICE ========================================================= */
    const expEl = document.getElementById("exp");
    const resEl = document.getElementById("res");
    const keypad = document.getElementById("keypad");
    const historyOverlay = document.getElementById("historyOverlay");
    const historyBtn = document.getElementById("historyBtn");
    const historyClose = document.getElementById("historyClose");
    const historyList = document.getElementById("historyList");
    const modeNormal = document.getElementById("modeNormal");
    const modeAdvanced = document.getElementById("modeAdvanced");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const confirmModal = document.getElementById("confirmModal");
    const confirmYes = document.getElementById("confirmYes");
    const confirmNo = document.getElementById("confirmNo");

    let expression = "";
    let result = 0;
    let currentEntryIndex = null;
    let justEvaluated = false;

    /* ========================================================= STORAGE NATIVO (Capacitor Preferences = dati dell'app) ========================================================= */
    const HISTORY_KEY = "simon_calc_history_v8";

    const CapacitorExports = (typeof window !== "undefined" && window.capacitorExports) || {};
    const Capacitor = CapacitorExports.Capacitor || null;
    const isNative = !!(Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
    const Preferences =
      (window.capacitorPreferences && window.capacitorPreferences.Preferences) ||
      (Capacitor && Capacitor.Plugins && Capacitor.Plugins.Preferences) ||
      CapacitorExports.Preferences ||
      null;
    const useNativeStorage = isNative && !!Preferences;

    let historyCache = [];
    let historyLoaded = false;

    function parseHistory(value) {
      if (!value) return [];
      try {
        const arr = JSON.parse(value);
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }

    function readWebStorage() {
      try { return parseHistory(localStorage.getItem(HISTORY_KEY)); } catch { return []; }
    }

    function persistHistory() {
      const value = JSON.stringify(historyCache);
      if (useNativeStorage) {
        Preferences.set({ key: HISTORY_KEY, value }).catch(() => {});
      } else {
        try { localStorage.setItem(HISTORY_KEY, value); } catch {}
      }
    }

    function clearHistory() {
      historyCache = [];
      if (useNativeStorage) {
        Preferences.remove({ key: HISTORY_KEY }).catch(() => {});
      } else {
        try { localStorage.removeItem(HISTORY_KEY); } catch {}
      }
    }

    async function initHistory() {
      if (useNativeStorage) {
        try {
          const res = await Preferences.get({ key: HISTORY_KEY });
          historyCache = parseHistory(res && res.value);
          if (!res || res.value === undefined || res.value === null) {
            const legacy = readWebStorage();
            if (legacy.length) {
              historyCache = legacy;
              persistHistory();
            }
          }
        } catch {
          historyCache = [];
        }
      } else {
        historyCache = readWebStorage();
      }
      historyLoaded = true;
      renderHistory();
    }

    function history() {
      if (!historyLoaded) historyCache = useNativeStorage ? [] : readWebStorage();
      return historyCache;
    }

    const normalKeys = [
      "AC","⌫","%","÷","7","8","9","×","4","5","6","−",
      "1","2","3","+","0",".","±","="
    ];
    const advancedKeys = [
      "AC","⌫","%","÷","7","8","9","×","4","5","6","−",
      "1","2","3","+","0",".","±","=",
      "√","x²","x³","xʸ","1/x","sin","cos","tan","π"
    ];

    function renderKeypad(mode) {
      keypad.innerHTML = "";
      const keys = mode === "advanced" ? advancedKeys : normalKeys;
      keys.forEach(k => {
        const btn = document.createElement("button");
        btn.className = "key";
        if (["AC","⌫","%","÷","×","−","+","±"].includes(k)) btn.classList.add("key-op");
        if (k === "=") btn.classList.add("key-main");
        if (["√","x²","x³","xʸ","1/x","sin","cos","tan","π"].includes(k)) btn.classList.add("adv-key");
        btn.textContent = k;
        btn.onclick = () => handleKey(k);
        keypad.appendChild(btn);
      });
    }

    function safeEval(expr) {
      if (!expr) return null;
      let e = expr
        .replace(/−/g, "-").replace(/×/g, "*").replace(/÷/g, "/")
        .replace(/%/g, "/100").replace(/\^/g, "**");
      if (/[-+*/]$/.test(e)) return "ERROR";
      try {
        const val = Function('"use strict";return(' + e + ')')();
        return Number.isFinite(val) ? val : "ERROR";
      } catch {
        return "ERROR";
      }
    }

    function updateDisplay() {
      expEl.textContent = expression;
      if (result === "ERROR") {
        resEl.textContent = tt("error");
        resEl.classList.add("error");
      } else {
        resEl.textContent = result;
        resEl.classList.remove("error");
      }
    }

    function saveCurrentEntry() {
      if (!expression) return;
      const v = safeEval(expression);
      if (v === "ERROR" || v === null) return;
      const arr = history();
      if (currentEntryIndex === null || currentEntryIndex >= arr.length) {
        arr.push({exp: expression, res: v});
        currentEntryIndex = arr.length - 1;
      } else {
        arr[currentEntryIndex] = {exp: expression, res: v};
      }
      persistHistory();
      renderHistory();
    }

    function removeCurrentEntry() {
      if (currentEntryIndex === null) return;
      const arr = history();
      if (currentEntryIndex < arr.length) {
        arr.splice(currentEntryIndex, 1);
        persistHistory();
      }
      currentEntryIndex = null;
      renderHistory();
    }

    function loadFromHistory(idx) {
      const arr = history();
      if (idx < 0 || idx >= arr.length) return;
      expression = "";
      result = 0;
      currentEntryIndex = null;
      const item = arr[idx];
      expression = item.exp;
      currentEntryIndex = idx;
      const v = safeEval(expression);
      if (v !== "ERROR" && v !== null) result = v;
      updateDisplay();
      renderHistory();
      historyOverlay.classList.remove("visible");
    }

    function renderHistory() {
      historyList.innerHTML = "";
      const arr = history();
      if (arr.length >= 2) {
        clearAllBtn.classList.add("visible");
      } else {
        clearAllBtn.classList.remove("visible");
      }
      if (arr.length === 0) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = tt("empty");
        historyList.appendChild(empty);
        return;
      }
      arr.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "history-item";
        if (idx === currentEntryIndex) row.classList.add("active");
        const txt = document.createElement("span");
        const displayRes = (item.res === "ERROR") ? tt("error") : item.res;
        txt.textContent = `${item.exp} = ${displayRes}`;
        row.onclick = (e) => {
          if (e.target.closest(".history-del")) return;
          loadFromHistory(idx);
        };
        const del = document.createElement("button");
        del.className = "history-del";
        del.setAttribute("aria-label", tt("delete"));
        del.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.71 12 12.01 5.7 5.7 4.29 7.11 10.59 13.4 4.29 19.7 5.7 21.11 12 14.81 18.3 21.11 19.71 19.7 13.41 13.4 19.71 7.11z"/></svg>`;
        del.onclick = (e) => {
          e.stopPropagation();
          arr.splice(idx, 1);
          if (currentEntryIndex !== null) {
            if (idx === currentEntryIndex) currentEntryIndex = null;
            else if (idx < currentEntryIndex) currentEntryIndex--;
          }
          persistHistory();
          renderHistory();
        };
        row.appendChild(txt);
        row.appendChild(del);
        historyList.appendChild(row);
      });
      historyList.scrollTop = historyList.scrollHeight;
    }

    function openConfirmModal() { confirmModal.classList.add("visible"); }
    function closeConfirmModal() { confirmModal.classList.remove("visible"); }

    clearAllBtn.onclick = () => { openConfirmModal(); };
    confirmYes.onclick = () => {
      clearHistory();
      currentEntryIndex = null;
      renderHistory();
      closeConfirmModal();
    };
    confirmNo.onclick = () => { closeConfirmModal(); };
    confirmModal.onclick = (e) => { if (e.target === confirmModal) closeConfirmModal(); };
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && confirmModal.classList.contains("visible")) {
        closeConfirmModal();
      }
    });

    function handleKey(k) {
      if (k === "AC") {
        expression = "";
        result = 0;
        currentEntryIndex = null;
        justEvaluated = false;
        updateDisplay();
        renderHistory();
        return;
      }
      if (k === "⌫") {
        expression = justEvaluated ? "" : expression.slice(0, -1);
        justEvaluated = false;
        if (expression === "") {
          result = 0;
          removeCurrentEntry();
        } else {
          const v = safeEval(expression);
          if (v !== "ERROR" && v !== null) result = v;
          saveCurrentEntry();
        }
        updateDisplay();
        return;
      }
      if (k === "±") {
        justEvaluated = false;
        if (expression === "" || /[\+\−\×÷\^]$/.test(expression)) {
          expression += "−";
        } else {
          const m = expression.match(/(\(\−)?(\d+\.?\d*\vert{}\.\d+)(\))?$/);
          if (m) {
            const num = m[2];
            const start = expression.length - m[0].length;
            if (m[1] && m[3]) expression = expression.slice(0, start) + num;
            else expression = expression.slice(0, start) + "(−" + num + ")";
          } else {
            expression += "−";
          }
        }
        const v = safeEval(expression);
        if (v !== "ERROR" && v !== null) result = v;
        saveCurrentEntry();
        updateDisplay();
        return;
      }
      if (k === "=") {
        const v = safeEval(expression);
        result = v;
        updateDisplay();
        if (v !== "ERROR" && expression !== "") {
          saveCurrentEntry();
          currentEntryIndex = null;
          justEvaluated = true;
          renderHistory();
        }
        return;
      }
      if (k === "√" || k === "x²" || k === "x³" || k === "1/x" || k === "sin" || k === "cos" || k === "tan") {
        let x = safeEval(expression);
        if (x === "ERROR" || x === null) x = result;
        if (k === "√") result = Math.sqrt(x);
        if (k === "x²") result = x*x;
        if (k === "x³") result = x*x*x;
        if (k === "1/x") result = 1/x;
        if (k === "sin") result = Math.sin(x);
        if (k === "cos") result = Math.cos(x);
        if (k === "tan") result = Math.tan(x);
        if (Number.isFinite(result)) {
          expression = String(result);
          saveCurrentEntry();
        } else {
          result = "ERROR";
        }
        updateDisplay();
        return;
      }
      if (k === "xʸ") {
        expression = (justEvaluated ? String(result) : expression) + "^";
        justEvaluated = false;
        updateDisplay();
        return;
      }
      if (k === "π") {
        result = Math.PI;
        expression = String(result);
        saveCurrentEntry();
        updateDisplay();
        return;
      }
      /* Dopo "=": una cifra ricomincia il calcolo, un operatore prosegue dal risultato. */
      if (justEvaluated) {
        expression = /[0-9.]/.test(k) ? "" : String(result);
        justEvaluated = false;
      }
      expression += k;
      const v = safeEval(expression);
      if (v !== "ERROR" && v !== null) result = v;
      saveCurrentEntry();
      updateDisplay();
    }

    historyBtn.onclick = () => {
      historyOverlay.classList.add("visible");
      renderHistory();
    };
    historyClose.onclick = () => { historyOverlay.classList.remove("visible"); };
    historyOverlay.onclick = e => { if (e.target === historyOverlay) historyOverlay.classList.remove("visible"); };
    modeNormal.onclick = () => {
      modeNormal.classList.add("active");
      modeAdvanced.classList.remove("active");
      renderKeypad("normal");
    };
    modeAdvanced.onclick = () => {
      modeAdvanced.classList.add("active");
      modeNormal.classList.remove("active");
      renderKeypad("advanced");
    };

    /* ========================================================= FEEDBACK DI PREMUTA (ripple delegato) ========================================================= */
    /* L'altezza visibile cambia quando il browser mostra/nasconde la barra degli indirizzi:
       senza questo, il 100vh del sito web è più alto dello schermo e l'ultima riga di tasti
       resta sotto la barra (sull'app Android, che non ha barra, non serve). */
    function syncViewportHeight() {
      const vv = window.visualViewport;
      const h = vv && vv.height ? vv.height : window.innerHeight;
      if (h > 0) document.documentElement.style.setProperty("--app-h", h + "px");
    }
    window.addEventListener("resize", syncViewportHeight, { passive: true });
    window.addEventListener("orientationchange", () => setTimeout(syncViewportHeight, 120), { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncViewportHeight, { passive: true });
      window.visualViewport.addEventListener("scroll", syncViewportHeight, { passive: true });
    }

    function spawnRipple(target, clientX, clientY) {
      if (!target || target.disabled) return;
      const rect = target.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = size + "px";
      ripple.style.height = size + "px";
      ripple.style.left = (clientX - rect.left - size / 2) + "px";
      ripple.style.top = (clientY - rect.top - size / 2) + "px";
      target.appendChild(ripple);
      const remove = () => { if (ripple.parentNode) ripple.parentNode.removeChild(ripple); };
      ripple.addEventListener("animationend", remove, { once: true });
      setTimeout(remove, 600);
    }

    (function initPressFeedback() {
      if (window.PointerEvent) {
        document.addEventListener("pointerdown", (e) => {
          spawnRipple(e.target.closest("button"), e.clientX, e.clientY);
        }, { passive: true });
        document.addEventListener("pointerup", () => {}, { passive: true });
      } else {
        document.addEventListener("touchstart", (e) => {
          const t = e.touches[0];
          if (t) spawnRipple(e.target.closest("button"), t.clientX, t.clientY);
        }, { passive: true });
      }
      document.addEventListener("contextmenu", (e) => {
        if (e.target.closest("button")) e.preventDefault();
      });
    })();

    syncViewportHeight();
    applyTranslations();
    renderKeypad("normal");
    updateDisplay();
    initHistory();
  </script>
</body>
</html>
